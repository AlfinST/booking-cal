<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Availability calendar</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1d1f23;
    --muted: #6b7077;
    --line: #dcdde0;
    --busy: #d62828;
    --busy-text: #ffffff;
    --today: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a;
      --surface: #1e2125;
      --text: #ececee;
      --muted: #9aa0a8;
      --line: #33373d;
      --busy: #e5484d;
      --today: #6e9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 460px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .bar h2 { font-size: 1.1rem; margin: 0; }
  button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, .day:focus-visible { outline: 2px solid var(--today); outline-offset: 2px; }
  .grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  .dow {
    text-align: center; font-size: .8rem; color: var(--muted); padding: 4px 0;
  }
  .day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    font: inherit; color: var(--text); padding: 0;
  }
  .day.pad { visibility: hidden; border: 0; }
  .day.today { border-color: var(--today); border-width: 2px; font-weight: 700; }
  .day.busy { background: var(--busy); border-color: var(--busy); color: var(--busy-text); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .count { margin-top: 12px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Availability calendar</h1>
  <p class="hint">Click a date to mark it occupied. Click again to clear it.</p>

  <div class="bar">
    <button id="prev" aria-label="Previous month">&lsaquo; Prev</button>
    <h2 id="title"></h2>
    <button id="next" aria-label="Next month">Next &rsaquo;</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="count" id="count"></div>

  <div class="actions">
    <button id="today">Go to today</button>
    <button id="clear">Clear this month</button>
  </div>
</main>

<script>
  const KEY = "occupied-dates";
  const pad = n => String(n).padStart(2, "0");
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;

  // Load saved dates (localStorage can be unavailable, so guard it)
  let occupied = new Set();
  try {
    occupied = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
  } catch (e) {}

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify([...occupied])); } catch (e) {}
  }

  const now = new Date();
  let year = now.getFullYear();
  let month = now.getMonth();

  const grid = document.getElementById("grid");
  const title = document.getElementById("title");
  const count = document.getElementById("count");

  function render() {
    grid.innerHTML = "";
    title.textContent = new Date(year, month, 1)
      .toLocaleDateString(undefined, { month: "long", year: "numeric" });

    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(d => {
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    const first = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < first; i++) {
      const p = document.createElement("div");
      p.className = "day pad";
      grid.appendChild(p);
    }

    let busyCount = 0;
    for (let d = 1; d <= days; d++) {
      const key = iso(year, month, d);
      const btn = document.createElement("button");
      btn.className = "day";
      btn.textContent = d;
      const isBusy = occupied.has(key);
      if (isBusy) { btn.classList.add("busy"); busyCount++; }
      if (key === iso(now.getFullYear(), now.getMonth(), now.getDate())) btn.classList.add("today");
      btn.setAttribute("aria-pressed", isBusy);
      btn.setAttribute("aria-label", `${key}${isBusy ? ", occupied" : ""}`);
      btn.addEventListener("click", () => {
        occupied.has(key) ? occupied.delete(key) : occupied.add(key);
        save();
        render();
      });
      grid.appendChild(btn);
    }
    count.textContent = `${busyCount} occupied ${busyCount === 1 ? "date" : "dates"} this month`;
  }

  document.getElementById("prev").onclick = () => {
    month--; if (month < 0) { month = 11; year--; } render();
  };
  document.getElementById("next").onclick = () => {
    month++; if (month > 11) { month = 0; year++; } render();
  };
  document.getElementById("today").onclick = () => {
    year = now.getFullYear(); month = now.getMonth(); render();
  };
  document.getElementById("clear").onclick = () => {
    const prefix = `${year}-${pad(month + 1)}-`;
    [...occupied].filter(k => k.startsWith(prefix)).forEach(k => occupied.delete(k));
    save();
    render();
  };

  render();
</script>
</body>
</html>
